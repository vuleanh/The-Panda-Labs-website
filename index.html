<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panda Labs</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
        .logo { font-size: 48px; margin-bottom: 12px; }
        h1 { font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
        .subtitle { color: #94a3b8; margin-bottom: 48px; }
        .apps { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 480px; }
        .app-card { background: #1e293b; border-radius: 12px; padding: 20px; display: flex; align-items: center; gap: 16px; text-decoration: none; color: inherit; }
        .app-icon { font-size: 32px; }
        .app-name { font-weight: 600; margin-bottom: 4px; }
        .app-desc { font-size: 0.875rem; color: #94a3b8; }
        .links { margin-top: 48px; display: flex; gap: 24px; }
        .links a { color: #6366f1; text-decoration: none; font-size: 0.875rem; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="logo">🐼</div>
    <h1>Panda Labs</h1>
    <p class="subtitle">Simple, privacy-focused apps for Android</p>

    <div class="apps">
        <div class="app-card">
            <div class="app-icon">🔒</div>
            <div>
                <div class="app-name">ShieldLock</div>
                <div class="app-desc">App Lock & Photo Vault — protect your apps and media</div>
            </div>
        </div>
    </div>

    <div class="links">
        <a href="https://sites.google.com/view/shieldlock-privacy-policy">Privacy Policy</a>
        <a href="mailto:le.anh.bme@gmail.com">Contact</a>
    </div>
</body>
</html>
